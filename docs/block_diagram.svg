<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="1160" height="560" fill="#ffffff"/>
  <text x="580" y="34" text-anchor="middle" font-size="22" font-weight="bold" fill="#111">spi_core — APB-to-SPI Master Core (Top Level)</text>
  <rect x="200" y="60" width="700" height="470" rx="10" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="8 5"/>

  <!-- APB bus side -->
  <g font-size="14" fill="#111">
    <text x="20" y="150">PCLK</text><text x="20" y="175">PRESETn</text>
    <text x="20" y="200">PADDR[2:0]</text><text x="20" y="225">PWRITE</text>
    <text x="20" y="250">PSEL</text><text x="20" y="275">PENABLE</text>
    <text x="20" y="300">PWDATA[7:0]</text>
    <text x="20" y="345">PRDATA[7:0]</text><text x="20" y="370">PREADY</text>
    <text x="20" y="395">PSLVERR</text>
  </g>
  <line x1="120" y1="225" x2="248" y2="225" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <line x1="248" y1="370" x2="122" y2="370" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="130" y="110" font-size="15" font-weight="bold" fill="#1f4e9e">APB Master</text>

  <!-- apb_slave -->
  <rect x="250" y="120" width="230" height="300" rx="8" fill="#e8f0fc" stroke="#1f4e9e" stroke-width="2"/>
  <text x="365" y="148" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f4e9e">apb_slave</text>
  <g font-size="13" fill="#222">
    <text x="265" y="178">• APB FSM: IDLE/SETUP/ENABLE</text>
    <text x="265" y="200">• PREADY / PSLVERR</text>
    <text x="265" y="222">• Registers:</text>
    <text x="280" y="242">CR1 (000)  CR2 (001)</text>
    <text x="280" y="262">BR (010)  SR (011)  DR (101)</text>
    <text x="265" y="286">• SPI mode FSM:</text>
    <text x="280" y="306">RUN / WAIT / STOP</text>
    <text x="265" y="330">• Interrupt request logic</text>
    <text x="265" y="352">• Mode-fault (MODF) detect</text>
  </g>

  <!-- baud_generator -->
  <rect x="600" y="90" width="250" height="120" rx="8" fill="#eaf7ec" stroke="#2e7d32" stroke-width="2"/>
  <text x="725" y="118" text-anchor="middle" font-size="17" font-weight="bold" fill="#2e7d32">baud_generator</text>
  <g font-size="13" fill="#222">
    <text x="612" y="144">Divisor = (SPPR+1)·2^(SPR+1)</text>
    <text x="612" y="166">SCLK with CPOL idle level</text>
    <text x="612" y="188">Shift / sample strobes (CPHA)</text>
  </g>

  <!-- spi_slave_select -->
  <rect x="600" y="245" width="250" height="100" rx="8" fill="#fff4e5" stroke="#c76b00" stroke-width="2"/>
  <text x="725" y="273" text-anchor="middle" font-size="17" font-weight="bold" fill="#c76b00">spi_slave_select</text>
  <g font-size="13" fill="#222">
    <text x="612" y="299">SS low for one 8-bit transfer</text>
    <text x="612" y="321">receive_data, TIP</text>
  </g>

  <!-- shifter -->
  <rect x="600" y="380" width="250" height="120" rx="8" fill="#f6e9f7" stroke="#8e24aa" stroke-width="2"/>
  <text x="725" y="408" text-anchor="middle" font-size="17" font-weight="bold" fill="#8e24aa">shifter</text>
  <g font-size="13" fill="#222">
    <text x="612" y="434">Full-duplex shift register</text>
    <text x="612" y="456">MSB-first / LSB-first (LSBFE)</text>
    <text x="612" y="478">TX on MOSI, RX from MISO</text>
  </g>

  <!-- internal connections -->
  <g stroke="#333" stroke-width="1.8" fill="none">
    <path d="M480 170 H575 V150 H598" marker-end="url(#a)"/>
    <path d="M480 290 H598" marker-end="url(#a)"/>
    <path d="M480 400 H560 V430 H598" marker-end="url(#a)"/>
    <path d="M598 470 H540 V410 H482" marker-end="url(#a)"/>
    <path d="M725 210 V243" marker-end="url(#a)"/>
    <path d="M760 210 V230 H880 V440 H852" marker-end="url(#a)"/>
    <path d="M690 345 V378" marker-end="url(#a)"/>
  </g>
  <g font-size="11.5" fill="#444">
    <text x="486" y="146">cpol, cpha,</text><text x="486" y="162">sppr, spr</text>
    <text x="486" y="282">send_data, mstr</text>
    <text x="486" y="392">mosi_data, lsbfe</text>
    <text x="486" y="465">miso_data</text>
    <text x="718" y="232" text-anchor="end">BaudRateDivisor</text>
    <text x="884" y="300" transform="rotate(90 884 300)">shift/sample flags</text>
    <text x="698" y="366">ss, receive_data</text>
  </g>

  <!-- SPI pins -->
  <g stroke="#333" stroke-width="2">
    <line x1="850" y1="150" x2="968" y2="150" marker-end="url(#a)"/>
    <line x1="850" y1="290" x2="968" y2="290" marker-end="url(#a)"/>
    <line x1="850" y1="410" x2="968" y2="410" marker-end="url(#a)"/>
    <line x1="968" y1="470" x2="852" y2="470" marker-end="url(#a)"/>
    <line x1="480" y1="390" x2="560" y2="390" stroke="none"/>
  </g>
  <g font-size="14" fill="#111">
    <text x="975" y="155">SCLK</text>
    <text x="975" y="295">SS</text>
    <text x="975" y="415">MOSI</text>
    <text x="975" y="475">MISO</text>
  </g>
  <text x="970" y="110" font-size="15" font-weight="bold" fill="#8e24aa">SPI Slave</text>
  <line x1="365" y1="420" x2="365" y2="512" stroke="#333" stroke-width="2"/>
  <line x1="365" y1="512" x2="968" y2="512" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="975" y="517" font-size="14" fill="#111">spi_interrupt_request</text>
</svg>
